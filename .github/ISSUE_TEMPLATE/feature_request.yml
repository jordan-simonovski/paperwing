name: Idea or feature request
description: Something PaperWing could do, or do better.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The thing you wanted to read, find or share, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches and examples from other apps are welcome.
  - type: textarea
    id: more
    attributes:
      label: Anything else
