name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changeset check compares with the pull request's base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # App changes need a changeset, or they never reach "What's new" or production (.changeset/README.md).
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/changelog/require.sh "$(git merge-base "$BASE_SHA" HEAD)" HEAD
      - run: npm ci
      - run: npm run build
      # What a first visit downloads, gzipped, against a budget (scripts/bundle-budget.mjs).
      - run: npm run check:budget
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Pending changesets become "What's new": kind, bump and wording are checked (.changeset/README.md).
      - run: npm run check:changesets
      # Every Storybook story renders in Chromium as a test.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
      # The journeys in e2e/, against the built app with every request stubbed (CONTRIBUTING.md).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Lighthouse on the built app: accessibility, best practices and layout shift fail the build;
  # performance and SEO warn (lighthouserc.json). The reports go to Lighthouse CI's temporary public
  # storage (only public pages are audited), which is what lets the GitHub App post a status check on
  # the pull request; the raw runs are also kept as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:lighthouse
        env:
          # The Lighthouse CI GitHub App's token: lhci reads it to post a status check on the pull request.
          # Missing (a fork's pull request), lhci still runs and asserts; it just doesn't post.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
