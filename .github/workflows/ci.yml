name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Pending changesets become "What's new": kind, bump and wording are checked (.changeset/README.md).
      - run: npm run check:changesets
      # Every Storybook story renders in Chromium as a test.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
