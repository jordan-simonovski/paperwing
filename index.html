<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f1" />
    <meta name="description" content="The open web, read your way: news, Lemmy communities, Bluesky and Hacker News, organised by topic. Free, and yours." />
    <!-- Link previews (Bluesky, Mastodon, Slack, iMessage…): artwork from scripts/brand.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperWing" />
    <meta property="og:title" content="PaperWing: the open web, read your way" />
    <meta property="og:description" content="News, Lemmy communities, Bluesky and Hacker News, organised by topic. Free, and yours." />
    <meta property="og:url" content="https://paperwing.io/" />
    <meta property="og:image" content="https://paperwing.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PaperWing: the open web, read your way. Pip the paper owl reading a book." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://paperwing.io/og.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PaperWing" />
    <link rel="alternate" type="application/rss+xml" title="PaperWing front page" href="/rss/front" />
    <!-- Keep iOS status chrome opaque so it does not shade the app's top controls. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>PaperWing</title>
    <script>
      // Set theme before first paint so dark mode never flashes light.
      try {
        const p = JSON.parse(localStorage.getItem('readout:prefs') || '{}').state || {}
        const t = p.theme === 'light' || p.theme === 'dark' ? p.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.text = p.textSize || 'md'
        document.documentElement.dataset.density = p.density || 'comfortable'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
